<h1>התשלום <span>התקבל.</span> תודה.</h1>
<p>הפרוטוקול כבר אצלך. מה עושים עכשיו:</p>
<div class="box">
<p><b>1.</b> בודקים את המייל. אישור הקנייה והקבלה נשלחים אליו מ-UPAY.</p>
<p><b>2.</b> פרטי הגישה לפרוטוקול נשלחים אליך למייל הזה. אם לא הגיעו תוך שעה, בודקים בתיקיית הספאם.</p>
<p><b>3.</b> עדיין לא הגיע כלום? כותבים לי בוואטסאפ ואני מטפל בזה ביד.</p>
